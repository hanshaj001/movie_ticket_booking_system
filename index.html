<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket Booking System</title>
    <style>
        :root {
            --primary: #ff4d2d;
            --primary-dark: #e63e1f;
            --bg: #f5f5f7;
            --card: #ffffff;
            --text: #222222;
            --muted: #777777;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fff4f1 0%, var(--bg) 100%);
            color: var(--text);
            padding: 20px;
        }

        .hero-card {
            background: var(--card);
            width: 100%;
            max-width: 520px;
            padding: 40px 32px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .brand {
            display: inline-block;
            padding: 8px 14px;
            margin-bottom: 18px;
            background: #fff4f1;
            color: var(--primary);
            border-radius: 999px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 12px;
            color: var(--text);
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: var(--muted);
            margin-bottom: 24px;
        }

        .login-btn {
            width: 100%;
            padding: 14px 18px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .login-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .login-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="hero-card">
        <div class="brand">Movie Ticket Booking</div>
        <h1>Welcome back!</h1>
        <p>Book your favorite movies quickly and securely. Sign in to continue to your dashboard.</p>
        <button class="login-btn" id="loginBtn">Login</button>
    </div>

    <script>
        document.getElementById('loginBtn').addEventListener('click', function () {
            window.location.href = 'login.php';
        });
    </script>
</body>
</html>
